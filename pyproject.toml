[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "splitguard"
version = "0.1.0"
description = "Deterministic overlap checks for LLM training and evaluation datasets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "James Childs-Maidment", email = "10917363+thisbejim@users.noreply.github.com" },
]
keywords = [
  "llm",
  "dataset",
  "evaluation",
  "benchmark",
  "contamination",
  "deduplication",
  "jsonl",
  "openai",
  "llama",
  "ci",
  "cli",
  "local-first",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
  "Topic :: Text Processing",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8.0,<9",
  "ruff>=0.8,<1",
]

[project.urls]
Homepage = "https://github.com/thisbejim/splitguard"
Repository = "https://github.com/thisbejim/splitguard"
Issues = "https://github.com/thisbejim/splitguard/issues"

[project.scripts]
splitguard = "splitguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/splitguard"]
